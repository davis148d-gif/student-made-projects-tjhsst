<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>2048</title>
    <meta property="og:title" content="2048 Custom Grid" />
    <meta property="og:description" content="A dark-themed single-file HTML clone of 2048 supporting custom square and non-square grid sizes with automatic responsive resizing." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="../2048.png">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>

      :root {
        --bg: #171614;
        --well: #211f1c;
        --slot: #2b2824;
        --rule: #2e2b27;
        --rule-strong: #433f39;
        --ink: #ebe6dc;
        --ink-dim: #9a9387;
        --ink-faint: #666057;
        --accent: #d97736;
        --accent-hover: #e58747;
        --accent-ink: #171614;
        --font-sans: 'Archivo', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
        --font-mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
        width: 100%;
        background-color: var(--bg);
        color: var(--ink);
        font-family: var(--font-sans);
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
      }

      .app-shell {
        display: flex;
        flex-direction: column;
        height: 100dvh;
        width: 100%;
        max-width: 980px;
        margin: 0 auto;
        padding: 18px 24px 14px;
        gap: 14px;
      }

      /* Header */
      .top-bar {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--rule);
        flex-shrink: 0;
        flex-wrap: wrap;
      }

      .brand-group {
        display: flex;
        align-items: baseline;
        gap: 12px;
      }

      .brand-title {
        font-size: clamp(2rem, 3.5vw, 2.5rem);
        font-weight: 800;
        letter-spacing: -0.04em;
        line-height: 0.92;
        color: var(--ink);
      }

      .brand-meta {
        font-family: var(--font-mono);
        font-size: 0.75rem;
        color: var(--ink-dim);
        white-space: nowrap;
      }

      .hud-right {
        display: flex;
        align-items: flex-end;
        gap: 20px;
        flex-wrap: wrap;
      }

      .scores {
        display: flex;
        align-items: flex-end;
        gap: 20px;
      }

      .score-box {
        position: relative;
        text-align: right;
      }

      .score-label {
        font-family: var(--font-mono);
        font-size: 0.6875rem;
        color: var(--ink-faint);
        letter-spacing: 0.04em;
        text-transform: uppercase;
        line-height: 1.2;
      }

      .score-value {
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
        font-size: 1.25rem;
        font-weight: 600;
        color: var(--ink);
        line-height: 1.15;
      }

      .score-delta {
        position: absolute;
        right: 0;
        top: -4px;
        font-family: var(--font-mono);
        font-size: 0.8125rem;
        font-weight: 600;
        color: var(--accent);
        pointer-events: none;
        animation: floatUp 600ms ease-out forwards;
      }

      @keyframes floatUp {
        0% {
          opacity: 1;
          transform: translateY(0);
        }
        100% {
          opacity: 0;
          transform: translateY(-22px);
        }
      }

      .actions {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 34px;
        padding: 0 12px;
        border-radius: 4px;
        border: 1px solid var(--rule-strong);
        background: transparent;
        color: var(--ink);
        font-family: var(--font-sans);
        font-size: 0.8125rem;
        font-weight: 700;
        letter-spacing: 0.01em;
        cursor: pointer;
        white-space: nowrap;
        flex-shrink: 0;
        transition: background-color 110ms ease, border-color 110ms ease, color 110ms ease;
      }

      .btn:hover:not(:disabled) {
        background: var(--well);
        border-color: var(--ink-dim);
      }

      .btn:active:not(:disabled) {
        transform: translateY(1px);
      }

      .btn:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }

      .btn:focus-visible,
      .preset-btn:focus-visible,
      .stepper-btn:focus-visible,
      .dim-input:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .btn-primary {
        background: var(--ink);
        border-color: var(--ink);
        color: var(--bg);
      }

      .btn-primary:hover:not(:disabled) {
        background: #ffffff;
        border-color: #ffffff;
      }

      .btn-icon {
        width: 34px;
        padding: 0;
        color: var(--ink-dim);
      }

      .btn-icon:hover:not(:disabled) {
        color: var(--ink);
      }

      /* Grid Controls Strip (unboxed, hairline-separated) */
      .controls-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-shrink: 0;
        flex-wrap: wrap;
      }

      .presets-group {
        display: flex;
        align-items: center;
        gap: 2px;
        flex-wrap: wrap;
      }

      .control-label {
        font-family: var(--font-mono);
        font-size: 0.75rem;
        color: var(--ink-faint);
        margin-right: 8px;
        white-space: nowrap;
      }

      .preset-btn {
        height: 28px;
        padding: 0 8px;
        border: none;
        border-bottom: 2px solid transparent;
        background: transparent;
        color: var(--ink-dim);
        font-family: var(--font-mono);
        font-size: 0.8125rem;
        font-weight: 500;
        cursor: pointer;
        white-space: nowrap;
        transition: color 110ms ease, border-color 110ms ease;
      }

      .preset-btn:hover {
        color: var(--ink);
      }

      .preset-btn.active {
        color: var(--ink);
        border-bottom-color: var(--accent);
      }

      .custom-dims {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      .stepper {
        display: inline-flex;
        align-items: center;
        border: 1px solid var(--rule);
        border-radius: 4px;
        height: 28px;
        background: var(--well);
      }

      .stepper-label {
        font-family: var(--font-mono);
        font-size: 0.6875rem;
        color: var(--ink-faint);
        padding: 0 7px;
        border-right: 1px solid var(--rule);
        height: 100%;
        display: inline-flex;
        align-items: center;
      }

      .stepper-btn {
        width: 24px;
        height: 100%;
        border: none;
        background: transparent;
        color: var(--ink-dim);
        font-family: var(--font-mono);
        font-size: 0.9375rem;
        line-height: 1;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .stepper-btn:hover:not(:disabled) {
        color: var(--ink);
        background: var(--slot);
      }

      .stepper-btn:disabled {
        opacity: 0.25;
        cursor: not-allowed;
      }

      .dim-input {
        width: 30px;
        height: 100%;
        border: none;
        background: transparent;
        color: var(--ink);
        font-family: var(--font-mono);
        font-size: 0.8125rem;
        font-weight: 600;
        text-align: center;
        appearance: textfield;
        -moz-appearance: textfield;
      }

      .dim-input::-webkit-outer-spin-button,
      .dim-input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }

      .dim-sep {
        color: var(--ink-faint);
        font-family: var(--font-mono);
        font-size: 0.8125rem;
      }

      /* Game Stage */
      .stage {
        flex: 1 1 auto;
        min-height: 0;
        min-width: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        width: 100%;
      }

      .board-wrapper {
        position: relative;
        background: var(--well);
        border: 1px solid var(--rule);
        box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.45);
        touch-action: none;
      }

      .grid-bg {
        display: grid;
        position: relative;
        z-index: 1;
      }

      .grid-cell {
        background: var(--slot);
      }

      .tile-layer {
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
      }

      .tile {
        position: absolute;
        top: 0;
        left: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-sans);
        font-weight: 800;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.03em;
        will-change: transform;
        transition: transform 110ms cubic-bezier(0.2, 0.9, 0.3, 1);
      }

      .tile-inner {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: inherit;
        box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.24);
      }

      .tile.is-new .tile-inner {
        animation: tileSpawn 140ms ease-out backwards;
      }

      .tile.is-merged .tile-inner {
        animation: tilePop 160ms ease-out;
      }

      @keyframes tileSpawn {
        0% {
          opacity: 0;
          transform: scale(0.5);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes tilePop {
        0% {
          transform: scale(1);
        }
        45% {
          transform: scale(1.11);
        }
        100% {
          transform: scale(1);
        }
      }

      /* Matte Earth & Print Tile Palette */
      .tile-2 .tile-inner    { background: #3b3731; color: #ebe6dc; }
      .tile-4 .tile-inner    { background: #4a443c; color: #f5f0e6; }
      .tile-8 .tile-inner    { background: #9c5a2d; color: #fff8f0; }
      .tile-16 .tile-inner   { background: #b55326; color: #fff8f0; }
      .tile-32 .tile-inner   { background: #b83c2c; color: #fff8f0; }
      .tile-64 .tile-inner   { background: #9e2a24; color: #fff8f0; }
      .tile-128 .tile-inner  { background: #a87f24; color: #fffbf0; }
      .tile-256 .tile-inner  { background: #ba8d22; color: #fffbf0; }
      .tile-512 .tile-inner  { background: #cc9b1e; color: #171614; }
      .tile-1024 .tile-inner { background: #dba81c; color: #171614; }
      .tile-2048 .tile-inner { background: #e8b923; color: #171614; }
      .tile-super .tile-inner { background: #2f7d6d; color: #f2faf8; }

      /* Board Overlay */
      .board-overlay {
        position: absolute;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: rgba(23, 22, 20, 0.88);
        border-radius: inherit;
        padding: 20px;
        text-align: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 180ms ease;
      }

      .board-overlay.visible {
        opacity: 1;
        pointer-events: auto;
      }

      .overlay-title {
        font-size: clamp(1.5rem, 4vw, 2.125rem);
        font-weight: 800;
        color: var(--ink);
        letter-spacing: -0.03em;
      }

      .overlay-subtitle {
        font-family: var(--font-mono);
        font-size: 0.875rem;
        color: var(--ink-dim);
      }

      .overlay-actions {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 6px;
      }

      /* Footer */
      .footer-hint {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-shrink: 0;
        font-family: var(--font-mono);
        font-size: 0.75rem;
        color: var(--ink-faint);
      }

      @media (max-width: 640px) {
        .app-shell {
          padding: 12px 14px 10px;
          gap: 10px;
        }
        .brand-meta {
          display: none;
        }
        .hud-right {
          gap: 12px;
        }
        .scores {
          gap: 14px;
        }
        .score-value {
          font-size: 1.0625rem;
        }
        .control-label {
          display: none;
        }
        .footer-hint {
          justify-content: center;
        }
        .footer-keys {
          display: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .tile,
        .tile.is-new .tile-inner,
        .tile.is-merged .tile-inner,
        .score-delta {
          animation: none !important;
          transition: none !important;
        }
      }
    

    </style>
  </head>
  <body>
    <div class="app-shell">
      <header class="top-bar">
        <div class="brand-group">
          <h1 class="brand-title">2048</h1>
          <span class="brand-meta" id="gridMeta">4 × 4 · Classic</span>
        </div>

        <div class="hud-right">
          <div class="scores">
            <div class="score-box" id="scoreBox">
              <div class="score-label">Score</div>
              <div class="score-value" id="scoreVal">0</div>
            </div>
            <div class="score-box">
              <div class="score-label">Best</div>
              <div class="score-value" id="bestVal">0</div>
            </div>
          </div>

          <div class="actions">
            <button class="btn" id="undoBtn" type="button" title="Undo last move (Z)" disabled>Undo</button>
            <button class="btn btn-icon" id="soundBtn" type="button" title="Toggle sound" aria-label="Toggle sound" aria-pressed="true">
              <svg id="soundOnIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
              <svg id="soundOffIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
            </button>
            <button class="btn btn-primary" id="newGameBtn" type="button">New Game</button>
          </div>
        </div>
      </header>

      <section class="controls-bar" aria-label="Grid size settings">
        <div class="presets-group" id="presetsGroup">
          <span class="control-label">Grid</span>
          <button class="preset-btn" type="button" data-r="3" data-c="3">3×3</button>
          <button class="preset-btn active" type="button" data-r="4" data-c="4">4×4</button>
          <button class="preset-btn" type="button" data-r="5" data-c="5">5×5</button>
          <button class="preset-btn" type="button" data-r="4" data-c="3">4×3</button>
          <button class="preset-btn" type="button" data-r="3" data-c="5">3×5</button>
          <button class="preset-btn" type="button" data-r="6" data-c="4">6×4</button>
        </div>

        <div class="custom-dims">
          <div class="stepper">
            <span class="stepper-label">Rows</span>
            <button class="stepper-btn" type="button" id="rowsDec" aria-label="Decrease rows">−</button>
            <input class="dim-input" type="number" id="rowsInput" min="2" max="10" value="4" aria-label="Rows" />
            <button class="stepper-btn" type="button" id="rowsInc" aria-label="Increase rows">+</button>
          </div>
          <span class="dim-sep" aria-hidden="true">×</span>
          <div class="stepper">
            <span class="stepper-label">Cols</span>
            <button class="stepper-btn" type="button" id="colsDec" aria-label="Decrease columns">−</button>
            <input class="dim-input" type="number" id="colsInput" min="2" max="10" value="4" aria-label="Columns" />
            <button class="stepper-btn" type="button" id="colsInc" aria-label="Increase columns">+</button>
          </div>
        </div>
      </section>

      <main class="stage" id="stage">
        <div class="board-wrapper" id="boardWrapper" role="application" aria-label="2048 game board">
          <div class="grid-bg" id="gridBg"></div>
          <div class="tile-layer" id="tileLayer"></div>

          <div class="board-overlay" id="overlay" aria-live="polite">
            <div class="overlay-title" id="overlayTitle">You reached 2048</div>
            <div class="overlay-subtitle" id="overlaySubtitle">Score: 0</div>
            <div class="overlay-actions">
              <button class="btn btn-primary" id="overlayPrimaryBtn" type="button">Keep Playing</button>
              <button class="btn" id="overlaySecondaryBtn" type="button">New Game</button>
            </div>
          </div>
        </div>
      </main>

      <footer class="footer-hint">
        <span class="footer-keys">Arrows / WASD to move · Z undo · R restart</span>
        <span>Swipe on touch screens</span>
      </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/gh/davis148d-gif/student-made-projects-tjhsst@main/js/2048.js"></script>
  </body>
</html>
